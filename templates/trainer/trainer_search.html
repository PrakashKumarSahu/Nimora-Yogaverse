{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find certified yoga trainers near you for personalized yoga sessions">
    <title>Find Yoga Trainers | Nimora Yogaverse</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/trainer/trainer_search.css' %}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" aria-label="Main navigation">
        <div class="container nav-container">
            <a href="#" class="logo" aria-label="YogaConnect Home">Nimora<span class="logo-premium">Yogaverse</span></a>
            <a href="#main-content" class="skip-link">Skip to content</a>
            
        </div>
    </nav>

    <!-- Search Hero -->
    <section class="search-hero">
        <div class="container">
            <h1>Find Your Perfect Yoga Trainer</h1>
            <p>Connect with certified instructors who match your style and location</p>
        </div>
    </section>

    <!-- Main Content -->
    <main id="main-content" class="container">
        <!-- Search Filters -->
        <div class="search-filters">
            <form id="trainer-search-form" aria-label="Search for yoga trainers">
                <div class="filter-group">
                    <label for="search">Name</label>
                    <input type="text" id="search" placeholder="Search by name..." aria-label="Search by trainer name">
                </div>
                <div class="filter-group">
                    <label for="location">Location</label>
                    <select id="location" aria-label="Filter by location">
                        <option value="">All Locations</option>
                        <option value="New York">New York</option>
                        <option value="Los Angeles">Los Angeles</option>
                        <option value="Chicago">Chicago</option>
                        <option value="Miami">Miami</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="yoga-type">Yoga Type</label>
                    <select id="yoga-type" aria-label="Filter by yoga type">
                        <option value="">All Types</option>
                        <option value="Hatha">Hatha</option>
                        <option value="Vinyasa">Vinyasa</option>
                        <option value="Ashtanga">Ashtanga</option>
                        <option value="Yin">Yin</option>
                    </select>
                </div>
                <button type="submit" class="search-btn" aria-label="Search trainers">
                    <i class="fas fa-search"></i> Search
                </button>
            </form>
        </div>

        <!-- Search Results -->
        <div id="search-results" aria-live="polite">
            <div class="trainers-grid">
                <!-- Trainer cards will be inserted here by JavaScript -->
            </div>
        </div>

        <!-- No Results State -->
        <div class="no-results" id="no-results" style="display: none;" aria-live="polite">
            <i class="fas fa-search" aria-hidden="true"></i>
            <h3>No trainers found</h3>
            <p>Try adjusting your search filters</p>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Finding your perfect yoga match...</p>
        </div>
    </main>

    <script src="{% static 'trainer/trainer_search.js' %}"></script>
</body>
</html>
