<form method="post" enctype="multipart/form-data" class="class-form" id="edit-class-form">
  {% csrf_token %}
  <input type="hidden" name="form_type" value="class">
  
  <div class="form-grid">
    <div class="form-group">
      <label for="id_name">Yoga Type</label>
      {{ form.name }}
    </div>
    
    <div class="form-group">
      <label for="id_level">Level</label>
      {{ form.level }}
    </div>
    
    <div class="form-group">
      <label for="id_duration_minutes">Duration (minutes)</label>
      {{ form.duration_minutes }}
    </div>
    
    <div class="form-group">
      <label for="id_price">Price</label>
      {{ form.price }}
    </div>
    
    <div class="form-group">
      <label for="id_slots">Available Slots</label>
      {{ form.slots }}
    </div>
    
    <div class="form-group">
      <label for="id_image">Class Image</label>
      {{ form.image }}
      {% if yoga_class.image %}
        <div class="image-preview">
          <img src="{{ yoga_class.image.url }}" alt="{{ yoga_class.name }}" id="image-preview" style="max-width: 100px; margin-top: 10px;">
        </div>
      {% endif %}
    </div>
  </div>
  
  <div class="form-group">
    <label>Days Available</label>
    <div class="checkbox-group days-available">
      {{ form.days_available }}
    </div>
  </div>
  
  <div class="form-group time-group">
    <label for="id_start_time">Start Time</label>
    {{ form.start_time }}
  </div>
  
  <div class="form-group time-group">
    <label for="id_end_time">End Time</label>
    {{ form.end_time }}
  </div>
  
  <div class="form-group full-width">
    <label for="id_description">Class Description</label>
    {{ form.description }}
  </div>
  
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </div>
</form>

<script>
document.getElementById('edit-class-form').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const formData = new FormData(this);
  
  fetch(window.location.href, {
    method: 'POST',
    body: formData,
    headers: {
      'X-Requested-With': 'XMLHttpRequest',
    }
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      window.location.reload();
    } else {
      // Handle form errors
      alert('There were errors saving your changes.');
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('An error occurred while saving.');
  });
});
</script>
